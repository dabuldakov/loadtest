name: loadtest

# Стек работает в host-сети и слушает только loopback:
#   Prometheus -> 127.0.0.1:9090
#   Grafana    -> 127.0.0.1:3000
# node_exporter на прод-сервере слушает 127.0.0.1:9100 и доступен через SSH-туннель
# (см. ./run.sh tunnel), поэтому Prometheus скрейпит его как 127.0.0.1:9100.

services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    network_mode: host
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://127.0.0.1:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,min,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      MAKEUP_BASE_URL: ${MAKEUP_BASE_URL:-http://90.188.89.63:8085}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-http://90.188.89.63:8086}
      CHAT_USERNAME: ${CHAT_USERNAME:-}
      CHAT_PASSWORD: ${CHAT_PASSWORD:-}
    volumes:
      - ./tests:/scripts:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: