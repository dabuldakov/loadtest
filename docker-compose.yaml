name: loadtest

# Только генератор нагрузки. Ни Prometheus, ни Grafana, ни алертов здесь нет:
# метрики прогона уходят в стек наблюдаемости через remote-write
# (K6_PROMETHEUS_RW_SERVER_URL в .env), а смотрят их в Grafana оттуда.
# Постоянный стек мониторинга живёт в отдельном репозитории `monitoring`.

services:
  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    network_mode: host
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://127.0.0.1:9090/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,min,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      # Тайминги и коэффициент VU. Без них сценарий молча уходил в дефолты
      # (1m/2m/30s) мимо значений из .env — прогон выходил 7m30s, хотя
      # LOAD_RAMP=5s LOAD_HOLD=10s LOAD_DOWN=2s задавали 40 секунд.
      LOAD_PEAK_RPS: ${LOAD_PEAK_RPS:-50}
      LOAD_RAMP: ${LOAD_RAMP:-1m}
      LOAD_HOLD: ${LOAD_HOLD:-2m}
      LOAD_DOWN: ${LOAD_DOWN:-30s}
      PREALLOC_FACTOR: ${PREALLOC_FACTOR:-0.15}
      MAKEUP_BASE_URL: ${MAKEUP_BASE_URL:-http://168.222.194.206:8085}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-http://168.222.194.206:8086}
      WCM_BASE_URL: ${WCM_BASE_URL:-http://89.104.66.226:8087}
      CHAT_USERNAME: ${CHAT_USERNAME:-}
      CHAT_PASSWORD: ${CHAT_PASSWORD:-}
    volumes:
      - ./tests:/scripts:ro
