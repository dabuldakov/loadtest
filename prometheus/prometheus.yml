global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # node_exporter на целевом сервере — через SSH-туннель на 127.0.0.1:9100,
  # и на машине-генераторе — на 127.0.0.1:9101 (ставится скриптом:
  #   PORT=9101 ./server/install-node-exporter.sh).
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: akm-server
      - targets: ["127.0.0.1:9101"]
        labels:
          instance: loadtest-generator

  # RTT/потери до целевого сервера через blackbox_exporter (127.0.0.1:9115).
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["90.188.89.63"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["90.188.89.63:8085", "90.188.89.63:8086"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115