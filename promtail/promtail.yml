# Promtail — сбор docker-логов на целевом сервере и доставка в локальный Loki.
# Деплой через ./server/install-logging.sh рядом с loki.yaml.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # label 'container' = имя docker-контейнера (chat-backend-app-1, ...)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Не тащим мониторинг и gitlab (шума много)
      - source_labels: ['container']
        regex: '(gitlab.*|promtail|loki|node_exporter|blackbox)'
        action: drop
      # label 'app' для удобных запросов {app="chat"} / {app="makeup"}
      - source_labels: ['container']
        regex: '(chat|makeup).*'
        target_label: app
    pipeline_stages:
      # Для JSON-логов приложений (chat/makeup) вытаскиваем level в отдельный
      # label — по нему удобно и дешево фильтровать и считать ошибки.
      - match:
          selector: '{app=~".+"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level: